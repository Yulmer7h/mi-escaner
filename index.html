<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Inventario BATA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader video { object-fit: cover !important; border-radius: 12px; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased select-none">

  <div id="root"></div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAop3ucrjAhM4wFR-xWrD-ZvmAsHfFg1VN6sjHAWDkZ2IY1f2IuNnBRHavOk8-DBJ9ng/exec";

    const { useState, useEffect, useRef, createElement: e } = React;

    let globalAudioCtx = null;

    const obtenerAudioContext = () => {
      if (!globalAudioCtx) {
        globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (globalAudioCtx.state === 'suspended') {
        globalAudioCtx.resume();
      }
      return globalAudioCtx;
    };

    const sonarExito = (activarVib) => {
      try {
        const audioCtx = obtenerAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(2400, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.06);
      } catch(err) {}

      if (activarVib && navigator.vibrate) {
        navigator.vibrate(50);
      }
    };

    const sonarError = (activarVib) => {
      try {
        const audioCtx = obtenerAudioContext();
        [0, 0.12].forEach((delay) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime + delay);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + 0.1);
        });
      } catch(err) {}

      if (activarVib && navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
    };

    function App() {
      const [dbLocal, setDbLocal] = useState([]);
      const [listaUsuarios, setListaUsuarios] = useState([]);
      const [usuarioActivo, setUsuarioActivo] = useState(() => {
        try {
          const u = localStorage.getItem("inv_usuario_activo");
          return u ? JSON.parse(u) : null;
        } catch(err) { return null; }
      });

      const [inputDni, setInputDni] = useState("");
      const [inputPass, setInputPass] = useState("");
      const [errorLogin, setErrorLogin] = useState("");

      const [cargandoBase, setCargandoBase] = useState(true);
      const [sincronizando, setSincronizando] = useState(false);
      const [escaneando, setEscaneando] = useState(false);
      const [linternaEncendida, setLinternaEncendida] = useState(false);

      const [datosUsuarios, setDatosUsuarios] = useState(() => {
        try {
          const guardado = localStorage.getItem("inv_datos_usuarios");
          return guardado ? JSON.parse(guardado) : {};
        } catch(err) { return {}; }
      });

      const [codigoManual, setCodigoManual] = useState("");
      const [cooldown, setCooldown] = useState(parseFloat(localStorage.getItem("inv_cooldown")) || 1.5);
      const [vibracionHabilitada, setVibracionHabilitada] = useState(localStorage.getItem("inv_vibracion") !== "false");
      const [modoCaja, setModoCaja] = useState(localStorage.getItem("inv_modo_caja") || "panoramico");
      const [mostrarModal, setMostrarModal] = useState(false);

      const scannerRef = useRef(null);
      const ultimoCodigoRef = useRef('');
      const tiempoUltimoEscaneoRef = useRef(0);

      useEffect(() => {
        cargarBaseEnRAM();
        const desbloquearAudio = () => obtenerAudioContext();
        window.addEventListener('click', desbloquearAudio, { once: true });
        window.addEventListener('touchstart', desbloquearAudio, { once: true });
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem("inv_datos_usuarios", JSON.stringify(datosUsuarios));
        } catch(err) {}
      }, [datosUsuarios]);

      const cargarBaseEnRAM = async () => {
        setSincronizando(true);
        try {
          const res = await fetch(WEB_APP_URL, { redirect: "follow" });
          const data = await res.json();
          setDbLocal(data.codigos || []);
          setListaUsuarios(data.usuarios || []);
          setCargandoBase(false);
          setSincronizando(false);
        } catch (err) {
          alert("Error al conectar con la base de datos: " + err);
          setCargandoBase(false);
          setSincronizando(false);
        }
      };

      const manejarLogin = (e) => {
        e.preventDefault();
        setErrorLogin("");
        const encontrado = listaUsuarios.find(
          u => String(u.dni).trim() === String(inputDni).trim() && String(u.pass).trim() === String(inputPass).trim()
        );
        if (!encontrado) {
          setErrorLogin("DNI o contraseña incorrectos.");
          return;
        }
        if (encontrado.estado.toLowerCase() !== "activo") {
          setErrorLogin("Tu usuario está inactivo. Consulta al administrador.");
          return;
        }
        setUsuarioActivo(encontrado);
        localStorage.setItem("inv_usuario_activo", JSON.stringify(encontrado));
        setInputDni("");
        setInputPass("");
      };

      const cerrarSesion = () => {
        detenerLector();
        setUsuarioActivo(null);
        localStorage.removeItem("inv_usuario_activo");
      };

      const usrKey = usuarioActivo ? usuarioActivo.nombre : "Anónimo";
      const contadorTurno = datosUsuarios[usrKey]?.contador || 0;
      const historial = datosUsuarios[usrKey]?.historial || [];

      const iniciarLectorContinuo = async () => {
        obtenerAudioContext();
        try {
          const html5QrCode = new Html5Qrcode("reader");
          scannerRef.current = html5QrCode;

          const config = { 
            fps: 30, 
            qrbox: modoCaja === "panoramico" 
              ? (viewfinderWidth, viewfinderHeight) => ({ width: viewfinderWidth * 0.85, height: 130 })
              : { width: 230, height: 210 },
            aspectRatio: 1.0
          };

          setEscaneando(true);
          setLinternaEncendida(false);

          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
              const codigoLeido = decodedText.trim();
              const ahora = Date.now();

              if (codigoLeido !== ultimoCodigoRef.current || (ahora - tiempoUltimoEscaneoRef.current) > (cooldown * 1000)) {
                procesarEscaneoCamara(codigoLeido, ahora);
              }
            },
            () => {}
          );
        } catch (err) {
          setEscaneando(false);
          alert("Error de inicio de cámara: " + err);
        }
      };

      const detenerLector = async () => {
        if (scannerRef.current && escaneando) {
          try {
            await scannerRef.current.stop();
            scannerRef.current.clear();
          } catch(err) {}
          setEscaneando(false);
          setLinternaEncendida(false);
        }
      };

      const toggleLinterna = async () => {
        if (scannerRef.current && escaneando) {
          try {
            const estadoNuevo = !linternaEncendida;
            await scannerRef.current.applyVideoConstraints({
              advanced: [{ torch: estadoNuevo }]
            });
            setLinternaEncendida(estadoNuevo);
          } catch (err) {
            alert("La linterna no está disponible en este dispositivo.");
          }
        }
      };

      const procesarEscaneoCamara = (codigo, timestamp = Date.now()) => {
        // Aceptar cualquier EAN-13 válido que empiece con 1 (ej: 13 dígitos numéricos)
        const esEan13Valido = /^1\d{12}$/.test(codigo);

        if (!esEan13Valido) {
          return; 
        }

        ultimoCodigoRef.current = codigo;
        tiempoUltimoEscaneoRef.current = timestamp;

        validarYGuardarCodigo(codigo);
      };

      const manejarEnvioManual = (ev) => {
        ev.preventDefault();
        const texto = codigoManual.trim();
        if (!texto) return;

        const esValido7 = /^\d{7}$/.test(texto);
        const esValidoEan13 = /^1\d{12}$/.test(texto);

        if (!esValido7 && !esValidoEan13) {
          sonarError(vibracionHabilitada);
          actualizarEstadoUsuario(false, "INVÁLIDO", texto);
          setCodigoManual("");
          return;
        }

        validarYGuardarCodigo(texto);
        setCodigoManual("");
      };

      const validarYGuardarCodigo = (codigo) => {
        // Verificamos si algún código de la base de datos está contenido dentro del código escrito/leído
        const existe = dbLocal.some(codigoBase => String(codigo).includes(String(codigoBase).trim()));

        if (existe) {
          sonarExito(vibracionHabilitada);
          actualizarEstadoUsuario(true, "OK", codigo);
          enviarAGoogleSheets(codigo, "guardar");
        } else {
          sonarError(vibracionHabilitada);
          const confirmarFuerza = confirm(
            `El código ${codigo} NO existe en la base de datos base.\n\n¿Deseas ingresarlo de todas formas al inventario?`
          );

          if (confirmarFuerza) {
            sonarExito(vibracionHabilitada);
            actualizarEstadoUsuario(true, "FORZADO", codigo);
            enviarAGoogleSheets(codigo, "guardar");
          } else {
            actualizarEstadoUsuario(false, "NO EXISTE", codigo);
          }
        }
      };

      const actualizarEstadoUsuario = (esExito, estadoText, codigo) => {
        setDatosUsuarios(prev => {
          const datosPrevios = prev[usrKey] || { contador: 0, historial: [] };
          const nuevoRegistro = {
            id: Date.now(),
            success: esExito,
            estadoText: estadoText,
            codigo: codigo,
            fecha: new Date().toLocaleTimeString()
          };

          return {
            ...prev,
            [usrKey]: {
              contador: esExito ? datosPrevios.contador + 1 : datosPrevios.contador,
              historial: [nuevoRegistro, ...datosPrevios.historial.slice(0, 9)]
            }
          };
        });
      };

      const enviarAGoogleSheets = (codigo, accion) => {
        const formData = new URLSearchParams();
        formData.append("codigo", codigo);
        formData.append("usuario", usrKey);
        formData.append("accion", accion);

        fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData
        });
      };

      const borrarLectura = (item) => {
        if (confirm(`¿Deseas eliminar el registro ${item.codigo}?`)) {
          setDatosUsuarios(prev => {
            const datosPrevios = prev[usrKey] || { contador: 0, historial: [] };
            return {
              ...prev,
              [usrKey]: {
                contador: (item.success && datosPrevios.contador > 0) ? datosPrevios.contador - 1 : datosPrevios.contador,
                historial: datosPrevios.historial.filter(i => i.id !== item.id)
              }
            };
          });
          enviarAGoogleSheets(item.codigo, "eliminar");
        }
      };

      const reiniciarTurno = () => {
        if (confirm(`¿Deseas reiniciar los contadores e historial de TODOS los usuarios en este dispositivo?`)) {
          setDatosUsuarios({});
          localStorage.removeItem("inv_datos_usuarios");
          setMostrarModal(false);
        }
      };

      const guardarAjustes = () => {
        const nuevoCool = parseFloat(document.getElementById("inputCool").value) || 1.5;
        const nuevaVib = document.getElementById("checkVib").checked;
        const nuevoCaja = document.getElementById("selectCaja").value;

        setCooldown(nuevoCool);
        setVibracionHabilitada(nuevaVib);
        setModoCaja(nuevoCaja);

        localStorage.setItem("inv_cooldown", nuevoCool);
        localStorage.setItem("inv_vibracion", nuevaVib);
        localStorage.setItem("inv_modo_caja", nuevoCaja);

        setMostrarModal(false);

        if (escaneando) {
          detenerLector().then(() => iniciarLectorContinuo());
        }
      };

      if (!usuarioActivo) {
        return e("div", { className: "flex flex-col justify-center items-center min-h-screen p-4 max-w-sm mx-auto" },
          e("div", { className: "w-full bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl space-y-5" },
            e("div", { className: "text-center" },
              e("h1", { className: "text-lg font-bold tracking-wider text-gray-100" }, "⚡ INICIAR SESIÓN"),
              e("p", { className: "text-xs text-gray-400 mt-1" }, "Escáner de Inventario BATA")
            ),
            cargandoBase ? 
              e("p", { className: "text-xs text-center text-emerald-400 font-mono animate-pulse" }, "Cargando base de datos...") :
              e("form", { onSubmit: manejarLogin, className: "space-y-4" },
                e("div", null,
                  e("label", { className: "text-xs text-gray-400 block mb-1" }, "DNI:"),
                  e("input", {
                    type: "number",
                    required: true,
                    placeholder: "Ingrese DNI",
                    value: inputDni,
                    onChange: (ev) => setInputDni(ev.target.value),
                    className: "w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                  })
                ),
                e("div", null,
                  e("label", { className: "text-xs text-gray-400 block mb-1" }, "Contraseña:"),
                  e("input", {
                    type: "password",
                    required: true,
                    placeholder: "Ingrese contraseña",
                    value: inputPass,
                    onChange: (ev) => setInputPass(ev.target.value),
                    className: "w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                  })
                ),
                errorLogin && e("p", { className: "text-xs text-red-400 font-bold text-center" }, errorLogin),
                e("button", {
                  type: "submit",
                  className: "w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm py-2.5 rounded-xl transition shadow-lg"
                }, "Ingresar")
              )
          )
        );
      }

      return e("div", { className: "flex flex-col p-3 max-w-md mx-auto relative gap-2.5" },
        e("div", { className: "flex justify-between items-center border-b border-gray-800 pb-2" },
          e("div", { className: "flex items-center gap-2" },
            e("h1", { className: "text-xs font-bold tracking-wider uppercase text-gray-200" }, "⚡ ESCÁNER BATA"),
            e("button", {
              onClick: () => setMostrarModal(true),
              title: "Ajustes de Escáner",
              className: "bg-gray-900 hover:bg-gray-800 border border-gray-700/80 text-gray-300 p-1.5 rounded-lg transition active:scale-90 flex items-center justify-center shadow-sm"
            },
              e("svg", { className: "w-3.5 h-3.5", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" }),
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M15 12a3 3 0 11-6 0 3 3 0 016 0z" })
              )
            )
          ),
          e("div", { className: "flex items-center gap-2" },
            e("span", { className: "text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50" }, `Base: ${dbLocal.length}`),
            e("button", {
              onClick: cargarBaseEnRAM,
              disabled: sincronizando,
              title: "Actualizar base de datos",
              className: "bg-gray-900 hover:bg-gray-800 border border-emerald-700/80 text-emerald-400 p-1.5 rounded-lg transition active:scale-90 flex items-center justify-center shadow-sm disabled:opacity-50"
            },
              e("svg", { className: `w-3.5 h-3.5 ${sincronizando ? 'animate-spin' : ''}`, fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" })
              )
            )
          )
        ),

        e("div", { className: "flex justify-between items-center bg-gray-900 px-3 py-2 rounded-xl border border-gray-800 text-xs" },
          e("div", { className: "flex items-center gap-2" },
            e("span", { className: "text-gray-400" }, "Usuario:"),
            e("span", { className: "text-emerald-400 font-bold" }, usuarioActivo.nombre),
            e("button", { onClick: cerrarSesion, className: "text-[10px] text-gray-400 hover:text-red-400 ml-1 underline" }, "(Salir)")
          ),
          e("div", null, "Capturados: ", e("span", { className: "text-emerald-400 font-bold text-sm" }, contadorTurno))
        ),

        e("div", { className: "bg-gray-900 border-2 border-emerald-500 rounded-2xl overflow-hidden relative min-h-[260px] flex flex-col items-center justify-center shadow-2xl" },
          e("div", { id: "reader", className: "w-full h-full" }),
          !escaneando && e("div", { className: "p-6 text-center space-y-4 absolute inset-0 bg-gray-900 flex flex-col justify-center items-center z-10" },
            e("p", { className: "text-xs text-gray-400" }, cargandoBase ? "Cargando registros desde la nube..." : "Listo para escanear"),
            e("button", {
              onClick: iniciarLectorContinuo,
              disabled: cargandoBase,
              className: "bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-sm py-3 px-6 rounded-xl shadow-lg transition disabled:opacity-50 flex items-center gap-2"
            },
              e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" }),
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M15 13a3 3 0 11-6 0 3 3 0 016 0z" })
              ),
              "INICIAR CÁMARA"
            )
          ),
          escaneando && e("div", { className: "absolute top-3 right-3 flex gap-2 z-20" },
            e("button", {
              onClick: toggleLinterna,
              className: `text-xs font-bold px-3 py-1.5 rounded-lg shadow-md transition flex items-center gap-1 ${linternaEncendida ? 'bg-yellow-500 text-black' : 'bg-gray-800/90 text-white border border-gray-700'}`
            },
              e("svg", { className: "w-3.5 h-3.5", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M13 10V3L4 14h7v7l9-11h-7z" })
              ),
              linternaEncendida ? 'On' : 'Flash'
            ),
            e("button", { onClick: detenerLector, className: "bg-red-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-md" }, "Detener")
          )
        ),

        e("form", { onSubmit: manejarEnvioManual, className: "flex gap-2" },
          e("input", {
            type: "number",
            placeholder: "Manual (7 dígitos o EAN-13)",
            value: codigoManual,
            onChange: (ev) => setCodigoManual(ev.target.value),
            className: "flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
          }),
          e("button", { type: "submit", className: "bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl active:scale-95 transition" }, "Agregar")
        ),

        historial.length > 0 && e("div", { className: "border-t border-gray-800 pt-2" },
          e("p", { className: "text-[10px] text-gray-400 mb-1 font-bold uppercase tracking-wider" }, "Últimas lecturas"),
          e("div", { className: "space-y-1 max-h-44 overflow-y-auto" },
            historial.map((item) => e("div", {
              key: item.id,
              className: `flex justify-between items-center px-3 py-1.5 rounded font-mono text-xs ${item.success ? 'bg-gray-900 text-emerald-400 border border-emerald-900/40' : 'bg-red-950/40 text-red-400 border border-red-900/60'}`
            },
              e("span", null, item.codigo),
              e("div", { className: "flex items-center gap-2" },
                e("span", { className: "text-[10px] font-bold uppercase" }, item.estadoText),
                item.success && e("button", {
                  onClick: () => borrarLectura(item),
                  className: "bg-red-600/80 hover:bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-sans font-bold"
                }, "Borrar")
              )
            ))
          )
        ),

        mostrarModal && e("div", { className: "fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50" },
          e("div", { className: "bg-gray-900 border border-gray-800 p-4 rounded-2xl w-full max-w-xs space-y-4" },
            e("h3", { className: "text-sm font-bold text-gray-200 flex items-center gap-1.5" },
              e("svg", { className: "w-4 h-4 text-emerald-400", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
